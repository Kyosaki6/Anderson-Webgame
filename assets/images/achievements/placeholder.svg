<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a2c0a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1c1208" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0705" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#805b10"/>
      <stop offset="100%" stop-color="#f5d061"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="50%" stop-color="#180e0a"/>
      <stop offset="100%" stop-color="#0e0705"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#bgGlow)"/>
  <rect x="3" y="3" width="114" height="114" rx="14" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" opacity="0.85"/>
  <rect x="7" y="7" width="106" height="106" rx="10" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Shield -->
  <path d="M60 22 C78 22 92 28 92 46 C92 72 68 88 60 96 C52 88 28 72 28 46 C28 28 42 22 60 22 Z"
        fill="url(#shieldGrad)" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Crossed Swords -->
  <g stroke="#e8c252" stroke-width="2.2" stroke-linecap="round">
    <line x1="42" y1="40" x2="78" y2="76"/>
    <line x1="78" y1="40" x2="42" y2="76"/>
    <!-- Hilts -->
    <line x1="38" y1="44" x2="46" y2="36" stroke-width="3"/>
    <line x1="74" y1="36" x2="82" y2="44" stroke-width="3"/>
  </g>

  <!-- Central Star / Trophy Insignia -->
  <polygon points="60,45 64,54 74,55 66,62 69,72 60,66 51,72 54,62 46,55 56,54"
           fill="#ffd700" stroke="#b8860b" stroke-width="1" filter="url(#goldGlow)"/>

  <!-- Corner Rivets -->
  <circle cx="10" cy="10" r="2.5" fill="#d4af37"/>
  <circle cx="110" cy="10" r="2.5" fill="#d4af37"/>
  <circle cx="10" cy="110" r="2.5" fill="#d4af37"/>
  <circle cx="110" cy="110" r="2.5" fill="#d4af37"/>
</svg>
